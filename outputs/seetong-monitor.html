<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seetong 区域监控</title>
<style>
:root {
  color-scheme: dark;
  font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  background: #101419;
  color: #eef2f6;
  --surface: #171d24;
  --field: #10161d;
  --line: #303c49;
  --muted: #aebbc8;
  --mint: #8de4b4;
  --amber: #ffbd81;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
main { max-width: 1440px; margin: auto; padding: 28px clamp(16px, 3vw, 44px) 56px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(1.4rem, 2.5vw, 1.85rem); font-weight: 650; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3 { font-size: .92rem; font-weight: 650; }
small { color: var(--muted); font-size: .82rem; line-height: 1.55; }
a { color: var(--mint); }
button, input, select { font: inherit; font-size: .9rem; min-height: 40px; border: 1px solid var(--line); border-radius: 7px; }
button { padding: 8px 13px; color: inherit; background: #222b36; cursor: pointer; }
button:not(:disabled):hover { background: #2b3946; border-color: #53677a; }
button.primary:not(:disabled) { color: #10291c; background: var(--mint); border-color: var(--mint); font-weight: 700; }
button.primary:not(:disabled):hover { background: #aeefcb; }
button[aria-pressed="true"] { color: var(--mint); border-color: #629d7b; background: #20362e; }
button:disabled { color: #8391a0; opacity: .76; cursor: default; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
input, select { width: 100%; min-width: 0; background: var(--field); color: inherit; padding: 8px 11px; }
label { display: grid; gap: 6px; color: #d0dae4; font-size: .88rem; }
.check { display: flex; align-items: center; gap: 8px; }
.check input { width: 16px; min-height: 16px; accent-color: var(--mint); }
.masthead { display: flex; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 19px; }
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; background: #21372f; border-radius: 8px; color: var(--mint); font-size: 1rem; font-weight: 750; }
.header-actions, .actions, .history-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.statusbar { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
.statuscell { display: grid; gap: 3px; padding: 10px 15px; min-width: 0; }
.statuscell + .statuscell { border-inline-start: 1px solid var(--line); }
.statuscell strong { font-size: .91rem; line-height: 1.5; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.status-light { display: inline-block; width: 7px; height: 7px; background: var(--amber); border-radius: 50%; margin-right: 7px; vertical-align: .08em; }
.status-light[data-live="true"] { background: var(--mint); }
.grid { display: grid; grid-template-columns: minmax(0,1fr) 308px; gap: 16px; align-items: start; }
.panel, dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: inherit; }
.panel { padding: 16px; }
.preview { padding: 0; overflow: hidden; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
.preview .toolbar h2 { display: flex; gap: 8px; align-items: center; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16/9; background: #080c11; }
canvas[data-editing="true"] { touch-action: none; cursor: crosshair; }
.area-tools { padding: 12px 14px; border-top: 1px solid var(--line); background: #1b242e; }
.area-tools p { margin-top: 8px; color: var(--muted); font-size: .85rem; line-height: 1.55; }
.area-tools .error { color: #ffb2aa; }
.area-tools button { min-height: 42px; }
.controls { display: grid; align-content: start; gap: 12px; min-width: 0; }
.control-panel { gap: 14px; }
.control-panel section, .control-panel form { display: grid; gap: 11px; }
.control-panel section { border-top: 1px solid var(--line); padding-top: 13px; }
.action-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.action-grid button { padding-inline: 8px; }
#detect { width: 100%; }
.error { color: #ffb2aa; font-size: .86rem; line-height: 1.5; }
.error:empty, .empty-hide:empty { display: none; }
.snapshots { margin-top: 16px; }
.events-heading { padding: 0 0 12px; }
.event-list, .event-cards { display: grid; gap: 0; list-style: none; padding: 0; margin: 0; }
.event-row, .event-card { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.event-row { flex-wrap: wrap; }
.event-row .recording-text { flex: 1 1 10rem; }
.event-row a, .event-body a { padding: 6px; font-size: .88rem; }
.recording-text { display: grid; gap: 4px; }
.shot, .event-thumb-empty { width: 106px; aspect-ratio: 16/9; flex: 0 0 auto; border-radius: 6px; overflow: hidden; padding: 0; background: var(--field); }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.event-thumb-empty { display: grid; place-items: center; }
.event-body { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 4px 14px; flex: 1; min-width: 0; }
.event-body .actions { grid-column: 2; grid-row: 1 / span 2; justify-content: flex-end; }
.event-body strong { font-size: .92rem; }
.event-body details { grid-column: 1 / -1; }
.event-timeline { display: grid; gap: 4px; padding: 4px 0 0; list-style: none; }
.event-change { text-align: start; color: var(--muted); padding: 4px 0; min-height: 32px; border: 0; background: transparent; }
.event-change time { color: var(--mint); margin-right: 8px; }
dialog { max-width: min(94vw, 1000px); max-height: 88dvh; padding: 16px; }
dialog::backdrop { background: #080b10c9; }
dialog img { display: block; max-width: 100%; margin-top: 12px; }
dialog video { display: block; width: min(84vw,880px); max-height: 68dvh; margin-top: 8px; background: #080c11; }
dialog .toolbar { padding: 0 0 12px; }
.history-dialog, .settings-dialog { width: min(94vw,740px); }
.history-dialog[open] { display: flex; flex-direction: column; overflow: hidden; }
.history-filters { padding-bottom: 12px; align-items: end; }
.history-filters label { flex: 1 1 120px; }
.history-list { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.settings-dialog > section + section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.settings-dialog form, .settings-dialog details { margin-top: 10px; }
.settings-fields { margin-top: 10px; }
.settings-dialog summary, .event-body summary { color: var(--muted); cursor: pointer; font-size: .83rem; }
.settings-dialog details[open] summary { margin-bottom: 6px; }
.storage-form { display: grid; gap: 10px; }
.storage-limits { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
.storage-form button { justify-self: start; }
.device-list strong { overflow-wrap: anywhere; }
.local-file-notice { max-width: 620px; }
.local-file-notice p { margin-top: 12px; }
@media (max-width: 800px) {
  main { padding-top: 16px; }
  .grid { grid-template-columns: 1fr; }
}
@media (max-width: 525px) {
  main { padding-inline: 10px; }
  .masthead { align-items: flex-start; gap: 8px; }
  .header-actions { gap: 5px; }
  .masthead button { padding-inline: 8px; }
  .brand { gap: 7px; }
  .brand-mark { display: none; }
  h1 { font-size: 1.35rem; }
  .statusbar { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .statuscell { padding: 8px 10px; }
  .statuscell:nth-child(3) { border-inline-start: 0; }
  .statuscell:nth-child(n+3) { border-top: 1px solid var(--line); }
  button { min-height: 44px; }
  .shot, .event-thumb-empty { width: 82px; }
  .event-body { grid-template-columns: 1fr; }
  .event-body .actions { grid-column: 1; grid-row: auto; justify-content: flex-start; }
  .storage-limits { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><h1>Seetong 区域监控</h1></div>
    <div class="header-actions"><button id="openHistory" type="button">历史录像</button><button id="openSettings" type="button">设置</button></div>
  </header>
  <section class="statusbar" aria-label="监控状态">
    <div class="statuscell"><small>连接</small><strong><span class="status-light" id="connectionLight" aria-hidden="true"></span><span id="status">连接本机服务…</span></strong></div>
    <div class="statuscell"><small>区域人数</small><strong id="count">—</strong></div>
    <div class="statuscell"><small>录像</small><strong id="recordIndicator">—</strong></div>
    <div class="statuscell"><small>手机提醒</small><strong id="deviceIndicator">—</strong></div>
  </section>
  <div class="grid">
    <section class="panel preview">
      <div class="toolbar"><h2 id="videoTitle">实时画面</h2><button id="editRegion" type="button" aria-expanded="false" aria-controls="areaTools" disabled>编辑区域</button></div>
      <canvas id="screen" width="640" height="360" aria-label="直播画面和检测区域"></canvas>
      <div class="area-tools" id="areaTools" hidden>
        <div class="actions" id="areaModes">
          <button id="startRectangle" type="button" aria-pressed="true">矩形</button>
          <button id="startPolygon" type="button" aria-pressed="false">多边形</button>
          <button id="startExclusion" type="button" aria-pressed="false">忽略区</button>
          <button id="clearExclusion" type="button" hidden>移除忽略区</button>
        </div>
        <div class="actions" id="polygonActions">
          <button id="undoPolygon" type="button">撤销上一点</button>
          <button id="savePolygon" type="button" class="primary">保存区域</button>
          <button id="cancelPolygon" type="button">取消</button>
        </div>
        <p id="areaHelp"></p>
        <p class="error" id="areaError" role="alert"></p>
      </div>
    </section>
    <aside class="panel controls control-panel" aria-label="监控操作">
      <h2>监控操作</h2>
      <form id="login" class="controls">
        <label>通道<select id="channel"><option value="1">第 1 路</option><option value="2">第 2 路</option><option value="3">第 3 路</option></select></label>
        <div class="action-grid"><button class="primary" id="start">打开预览</button><button type="button" id="stop">停止连接</button></div>
        <small class="empty-hide" id="recordStatus"></small>
      </form>
      <section aria-labelledby="detectHeading">
        <h3 id="detectHeading">人体检测</h3>
        <button id="detect" type="button">启动检测</button>
        <div class="action-grid" role="group" aria-label="人体检测模型">
          <button type="button" id="modelNano" aria-pressed="false" disabled>Nano · 省 CPU</button>
          <button type="button" id="modelOriginal" aria-pressed="false" disabled>原模型</button>
        </div>
        <small id="modelStatus" role="status"></small>
      </section>
      <p class="error" id="error" role="alert"></p>
    </aside>
  </div>
  <section class="panel snapshots">
    <div class="toolbar events-heading">
      <h2>最近区域事件</h2>
      <div class="header-actions">
        <small id="eventStatus"></small>
        <button id="openEventHistory" type="button">查看全部事件</button>
      </div>
    </div>
    <ul class="event-cards" id="eventList"><li><small>正在读取事件…</small></li></ul>
  </section>
</main>
<dialog id="settingsViewer" class="settings-dialog" aria-labelledby="settingsTitle">
  <div class="toolbar"><h2 id="settingsTitle">设置</h2><button id="closeSettings" type="button">关闭</button></div>
  <section>
    <h3>摄像头连接</h3>
    <div class="controls settings-fields">
      <label>云平台账号<input id="username" form="login" autocomplete="username" maxlength="200"></label>
      <label>密码<input id="password" form="login" type="password" autocomplete="current-password" maxlength="300"></label>
      <label class="check"><input id="remember" form="login" type="checkbox" checked>在本机记住账号和密码</label>
      <label class="check"><input id="record" form="login" type="checkbox" checked>同时保存连续录像</label>
      <small id="saved"></small>
      <div class="actions"><button id="applyConnection" type="button">打开预览</button><button id="forget" type="button">清除已记住的账号</button></div>
      <p class="error" id="connectionError" role="alert"></p>
    </div>
  </section>
  <section id="mobileAlerts">
    <h3>手机提醒</h3>
    <ul class="event-list device-list" id="alertDevices" aria-label="已绑定设备"><li><small>正在读取已绑定设备…</small></li></ul>
    <form class="controls" id="alertForm">
      <small>打开手机 WxPusher 的「我的 → SPT」，把 SPT 粘贴在这里。<a href="https://wxpusher.zjiecode.com/download/" target="_blank" rel="noreferrer">下载 WxPusher</a></small>
      <label>设备名称<input id="alertName" maxlength="40" placeholder="例如：我的手机"></label>
      <label>WxPusher SPT<input id="alertToken" type="password" autocomplete="off" maxlength="124" required></label>
      <div class="actions">
        <button id="saveAlert" type="submit">绑定设备</button>
      </div>
      <small id="alertStatus" role="status"></small>
      <small id="alertFeedback" role="status"></small>
    </form>
  </section>
  <section id="storageSettings">
    <h3>录像存储</h3>
    <form class="storage-form" id="storageForm">
      <div class="storage-limits">
        <label>事件视频及截图上限（GB）<input id="eventLimit" type="number" min="0.01" max="10000" step="0.01" required><small id="eventUsage"></small></label>
        <label>普通录像上限（GB）<input id="continuousLimit" type="number" min="0.01" max="10000" step="0.01" required><small id="continuousUsage"></small></label>
      </div>
      <small>达到上限时清理该类最旧的已保存文件。调低上限也会清理旧文件。</small>
      <button id="saveStorage" type="submit" disabled>保存上限</button>
      <small id="storageFeedback" role="status"></small>
    </form>
  </section>
</dialog>
<dialog id="viewer" aria-label="区域事件截图"><button id="closeShot" type="button">关闭</button><div id="shotContent"></div></dialog>
<dialog id="historyViewer" class="history-dialog" aria-labelledby="historyTitle">
  <div class="toolbar"><h2 id="historyTitle">历史录像</h2><button id="closeHistory" type="button">关闭</button></div>
  <div class="history-filters">
    <label>录像类型<select id="historyType"><option value="">全部类型</option><option value="continuous">连续录像</option><option value="event">事件录像</option></select></label>
    <label>日期<input id="historyDate" type="date"></label>
    <button id="refreshHistory" type="button">刷新列表</button>
  </div>
  <ul class="event-list history-list" id="historyList" aria-live="polite"></ul>
</dialog>
<dialog id="eventViewer" aria-labelledby="clipTitle"><div class="toolbar"><div><h2 id="clipTitle">录像回看</h2><small id="clipDuration" role="status"></small></div><button id="closeEvent">关闭</button></div><video id="eventPlayer" controls playsinline></video><p class="error" id="eventError" role="alert"></p></dialog>
<template id="localFileNotice">
  <section class="panel local-file-notice">
    <h1>从监控服务打开页面</h1>
    <p><a href="http://127.0.0.1:8765/">打开 Windows 监控页</a></p>
    <p>如果网页无法连接，请先双击同目录的「启动监控.cmd」。</p>
  </section>
</template>
<script>
if (location.protocol === 'file:') {
  document.querySelector('main').replaceChildren(document.getElementById('localFileNotice').content.cloneNode(true));
} else {
const session = '__SESSION_TOKEN__';
const byId = id => document.getElementById(id);
const screen = byId('screen'), ctx = screen.getContext('2d');
let state = {}, bitmap, drag, previewRegion, lastSequence = 0;
let channelInitialized = false;
let previousEvents;
let previousDevices;
let alertBusy = false;
let historyEntries = [];
let storageLoaded = false, storageBusy = false;
let starting = false;
async function request(path, data) {
  const headers = {'X-Seetong-Session':session};
  const options = {headers, cache:'no-store', signal:AbortSignal.timeout(data === undefined ? 8000 : 30000)};
  if (data !== undefined) {
    headers['Content-Type'] = 'application/json';
    options.method = 'POST';
    options.body = JSON.stringify(data);
  }
  const result = await fetch(path, options);
  if (!result.ok) {
    const error = await result.json().catch(() => ({}));
    throw Object.assign(new Error(error.error || '本机请求失败'), {status:result.status});
  }
  return result;
}
async function reloadExpiredSession() {
  try {
    const page = await fetch('/', {cache:'no-store', signal:AbortSignal.timeout(8000)});
    if (!page.ok) return;
    const current = (await page.text()).match(/const session = '([a-f0-9]{64})';/)?.[1];
    if (current && current !== session) location.reload();
  } catch (_) {
    // The next poll will retry if the tunnel or service is still coming back.
  }
}
let polygonDraft = null;
let exclusionDraft = false;
let polygonChannel = null;
let savingPolygon = false;
let areaMode = null;
function showAreaControls() {
  const editing = areaMode !== null;
  byId('editRegion').disabled = !bitmap || savingPolygon;
  byId('editRegion').setAttribute('aria-expanded', String(editing));
  byId('editRegion').textContent = editing ? '退出编辑' : '编辑区域';
  byId('areaTools').hidden = !editing;
  screen.dataset.editing = String(editing);
  for (const [mode,id] of [['rectangle','startRectangle'], ['polygon','startPolygon'], ['exclusion','startExclusion']]) {
    byId(id).setAttribute('aria-pressed', String(areaMode === mode));
    byId(id).disabled = savingPolygon;
  }
  byId('clearExclusion').hidden = !state.exclusion_regions?.[state.channel];
  byId('clearExclusion').disabled = savingPolygon;
  byId('undoPolygon').hidden = areaMode === 'rectangle';
  byId('undoPolygon').disabled = savingPolygon || !polygonDraft?.length;
  byId('savePolygon').disabled = savingPolygon || !bitmap || (areaMode === 'rectangle'
    ? !previewRegion || previewRegion[2] - previewRegion[0] < .02 || previewRegion[3] - previewRegion[1] < .02
    : (polygonDraft?.length ?? 0) < 3);
  byId('cancelPolygon').disabled = savingPolygon;
  byId('areaHelp').textContent = areaMode === 'rectangle' ? '拖动画面框选检测区域，再点「保存区域」。'
    : `${exclusionDraft ? '只圈住固定物体。进入忽略区的人员也不会计数。' : '沿检测边界依次点击拐角。'}至少 3 个点，已选 ${polygonDraft?.length ?? 0} 点。`;
}
function draw() {
  ctx.fillStyle = '#091013'; ctx.fillRect(0, 0, 640, 360);
  if (bitmap) ctx.drawImage(bitmap, 0, 0, 640, 360);
  else {
    ctx.fillStyle = '#a9bcb7'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('等待摄像头画面', 320, 184);
  }
  if (bitmap) {
    const region = (!exclusionDraft ? polygonDraft : null) ?? previewRegion ?? state.regions?.[state.channel];
    const excluded = (exclusionDraft ? polygonDraft : null) ?? state.exclusion_regions?.[state.channel];
    drawRegion(region, '#69e5ab', polygonDraft && !exclusionDraft);
    drawRegion(excluded, '#ffae66', polygonDraft && exclusionDraft);
  }
}
function drawRegion(region, color, showPoints) {
  if (region) {
    let points = region;
    if (typeof region[0] === 'number') {
      const [x,y,r,b] = region;
      points = [[x,y],[r,y],[r,b],[x,b]];
    }
    ctx.fillStyle = color + '24'; ctx.strokeStyle = color; ctx.lineWidth = 2;
    if (points.length > 1) {
      ctx.beginPath();
      ctx.moveTo(points[0][0]*640, points[0][1]*360);
      for (const [x,y] of points.slice(1)) ctx.lineTo(x*640,y*360);
      if (points.length >= 3) { ctx.closePath(); ctx.fill(); }
      ctx.stroke();
    }
    if (showPoints) {
      ctx.fillStyle = color;
      for (const [x,y] of points) {
        ctx.beginPath(); ctx.arc(x*640,y*360,4,0,Math.PI*2); ctx.fill();
      }
    }
  }
}
function position(event) {
  const rect = screen.getBoundingClientRect();
  const bound = n => Math.max(0, Math.min(1,n));
  return [bound((event.clientX-rect.left)/rect.width),bound((event.clientY-rect.top)/rect.height)];
}
screen.onpointerdown = event => {
  if (!bitmap || areaMode !== 'rectangle' || savingPolygon || drag || event.button !== 0) return;
  drag = {point:position(event), pointer:event.pointerId};
  previewRegion = null;
  screen.setPointerCapture(event.pointerId);
};
screen.onpointermove = event => {
  if (drag?.pointer !== event.pointerId) return;
  const [x,y] = position(event);
  const [left,top] = drag.point;
  previewRegion = [Math.min(x,left),Math.min(y,top),Math.max(x,left),Math.max(y,top)];
  draw();
};
screen.onpointercancel = event => {
  if (drag?.pointer !== event.pointerId) return;
  drag = previewRegion = null;
  showAreaControls(); draw();
};
screen.onpointerup = event => {
  if (drag?.pointer !== event.pointerId) return;
  screen.onpointermove(event);
  drag = null;
  showAreaControls();
};
function setAreaMode(mode) {
  if (mode && !bitmap) return;
  areaMode = mode;
  exclusionDraft = mode === 'exclusion';
  polygonDraft = mode && mode !== 'rectangle' ? [] : null;
  polygonChannel = mode ? state.channel : null;
  drag = previewRegion = null;
  byId('areaError').textContent = '';
  showAreaControls(); draw();
}
byId('editRegion').onclick = () => setAreaMode(areaMode ? null : 'rectangle');
byId('startRectangle').onclick = () => setAreaMode('rectangle');
byId('startPolygon').onclick = () => setAreaMode('polygon');
byId('startExclusion').onclick = () => setAreaMode('exclusion');
byId('clearExclusion').onclick = () => action(async () => {
  const channel = state.channel;
  if (!confirm('移除后，该区域会恢复人员检测。确定移除忽略区？')) return;
  await request('/api/exclusion-region', {channel, region: null});
  if (state.exclusion_regions) delete state.exclusion_regions[channel];
  showAreaControls(); draw();
}, 'areaError');
screen.onclick = event => {
  if (!bitmap || polygonDraft === null || savingPolygon || polygonDraft.length >= 32) return;
  polygonDraft.push(position(event));
  showAreaControls(); draw();
};
byId('undoPolygon').onclick = () => { polygonDraft?.pop(); showAreaControls(); draw(); };
byId('cancelPolygon').onclick = () => { setAreaMode(null); byId('editRegion').focus(); };
byId('savePolygon').onclick = () => action(async () => {
  if (byId('savePolygon').disabled) return;
  const region = areaMode === 'rectangle' ? previewRegion : polygonDraft;
  savingPolygon = true;
  showAreaControls();
  try {
    const route = exclusionDraft ? '/api/exclusion-region' : '/api/region';
    await request(route, {region, channel: polygonChannel});
    const regions = exclusionDraft ? (state.exclusion_regions ??= {}) : state.regions;
    regions[polygonChannel] = region;
    setAreaMode(null);
  } finally {
    savingPolygon = false;
    showAreaControls(); draw();
  }
}, 'areaError');
async function action(fn, errorId = 'error') {
  byId(errorId).textContent = '';
  try { await fn(); } catch(error) { byId(errorId).textContent = error.message; }
}
byId('login').onsubmit = event => {
  event.preventDefault();
  if (starting || state.active) return;
  const settings = byId('settingsViewer');
  if (!state.saved && (!byId('username').value.trim() || !byId('password').value)) {
    if (!settings.open) settings.showModal();
    byId('connectionError').textContent = '请输入云平台账号和密码。';
    (byId('username').value.trim() ? byId('password') : byId('username')).focus();
    return;
  }
  action(async () => {
    starting = true;
    byId('start').disabled = byId('applyConnection').disabled = true;
    try {
      await request('/api/start',{
        username:byId('username').value,password:byId('password').value,
        remember:byId('remember').checked,channel:Number(byId('channel').value),
        record:byId('record').checked
      });
      byId('username').value = '';
      byId('password').value = '';
      if (settings.open) settings.close();
    } finally {
      starting = false;
      byId('start').disabled = byId('applyConnection').disabled = !!state.active;
    }
  }, settings.open ? 'connectionError' : 'error');
};
byId('openSettings').onclick = () => byId('settingsViewer').showModal();
byId('closeSettings').onclick = () => byId('settingsViewer').close();
byId('applyConnection').onclick = () => byId('login').requestSubmit();
byId('stop').onclick = () => action(() => request('/api/stop',{}));
byId('forget').onclick = () => action(() => request('/api/forget',{}), 'connectionError');
byId('detect').onclick = () => action(() => request('/api/detect',{enabled:!state.detect}));
const modelButtons = {nano: byId('modelNano'), original: byId('modelOriginal')};
let savingModel = false;
function showDetectorModel() {
  const selected = state.detector_model;
  for (const [key, button] of Object.entries(modelButtons)) {
    button.disabled = savingModel || !state.detector_models?.[key];
    button.setAttribute('aria-pressed', String(selected === key));
    button.title = state.detector_models?.[key] ? '' : '尚未安装此模型';
  }
  const description = selected === 'nano'
    ? '当前：Nano。夜间强光下可能漏检远处人员。'
    : selected === 'original' ? '当前：原模型。' : '';
  byId('modelStatus').textContent = selected && state.detect && selected !== state.active_detector_model
    ? '正在切换检测模型…' : description;
}
for (const [key, button] of Object.entries(modelButtons)) {
  button.onclick = () => action(async () => {
    savingModel = true;
    showDetectorModel();
    try {
      await request('/api/detector-model', {model: key});
      state.detector_model = key;
    } finally {
      savingModel = false;
      showDetectorModel();
    }
  });
}
function showAlertState() {
  const alerts = state.alerts;
  const enabled = alerts?.enabled;
  byId('saveAlert').disabled = alertBusy || !alerts;
  const devices = alerts?.devices || [];
  const signature = JSON.stringify([devices, state.event_share]);
  const list = byId('alertDevices');
  if (previousDevices !== signature) {
    previousDevices = signature;
    if (!devices.length) showListMessage(list, '暂无已绑定设备');
    else list.replaceChildren(...devices.map(device => {
      const row = document.createElement('li');
      row.className = 'event-row';
      const label = document.createElement('span');
      label.className = 'recording-text';
      const name = document.createElement('strong'), binding = document.createElement('small');
      name.textContent = device.name; binding.textContent = 'WxPusher · 已绑定';
      label.append(name, binding);
      const test = document.createElement('button'), remove = document.createElement('button');
      test.textContent = state.event_share ? '测试录像提醒' : '发测试提醒';
      remove.textContent = '解绑';
      test.onclick = () => updateAlerts('test', {id:device.id, event:state.event_share === true}, '测试提醒已提交，请查看该设备。');
      remove.onclick = () => updateAlerts('unbind', {id:device.id}, '已解绑设备。');
      row.append(label, test, remove);
      return row;
    }));
  }
  list.querySelectorAll('button').forEach(button => {button.disabled = alertBusy;});
  const label = alerts ? (enabled ? '提醒已启用' : '提醒未启用') : '等待新版监控服务连接';
  const media = enabled ? (state.event_share ? '提醒内可打开截图和录像' : '仅文字 · 未配置手机可访问的录像链接') : '';
  byId('alertStatus').textContent = [label, media, alerts?.last_result].filter(Boolean).join(' · ');
}
async function updateAlerts(route, data, success) {
  alertBusy = true; showAlertState();
  const feedback = byId('alertFeedback');
  feedback.textContent = '';
  try {
    const result = await (await request('/api/alerts/' + route, data)).json();
    if (result.alerts) state.alerts = result.alerts;
    if (route === 'configure') byId('alertForm').reset();
    feedback.textContent = success;
  } catch (error) {
    feedback.textContent = error.message;
  } finally {
    alertBusy = false; showAlertState();
  }
}
byId('alertForm').onsubmit = event => {
  event.preventDefault();
  updateAlerts('configure', {name:byId('alertName').value, spt:byId('alertToken').value}, '已绑定。可从列表发送测试提醒。');
};
function showStorage() {
  if (!state.storage) return;
  const entries = [['event', 'eventLimit', 'eventUsage'], ['continuous', 'continuousLimit', 'continuousUsage']];
  for (const [kind, field, usage] of entries) {
    const {limit, used} = state.storage[kind];
    if (!storageLoaded) byId(field).value = limit / 1e9;
    const current = used < 1e9 ? `${(used / 1e6).toFixed(1)} MB` : `${(used / 1e9).toFixed(2)} GB`;
    byId(usage).textContent = `已用 ${current} / ${limit / 1e9} GB`;
  }
  storageLoaded = true;
  byId('saveStorage').disabled = storageBusy;
}
byId('storageForm').onsubmit = async event => {
  event.preventDefault();
  storageBusy = true; showStorage();
  const feedback = byId('storageFeedback');
  feedback.textContent = '';
  try {
    await request('/api/storage', {event:byId('eventLimit').valueAsNumber, continuous:byId('continuousLimit').valueAsNumber});
    feedback.textContent = '存储上限已保存。';
  } catch(error) {
    feedback.textContent = error.message;
  } finally { storageBusy = false; showStorage(); }
};
byId('closeShot').onclick = () => byId('viewer').close();
byId('viewer').onclose = () => {
  byId('shotContent').replaceChildren();
};
const eventPlayer = byId('eventPlayer');
byId('closeEvent').onclick = () => byId('eventViewer').close();
let playbackRequest = 0;
byId('eventViewer').onclose = () => {
  playbackRequest++;
  eventPlayer.pause(); eventPlayer.removeAttribute('src'); eventPlayer.load();
};
eventPlayer.onerror = () => {
  if (eventPlayer.getAttribute('src')) byId('eventError').textContent = '播放失败，可下载原始录像后打开。';
};
function showListMessage(list, message) {
  const row = document.createElement('li'), label = document.createElement('small');
  label.textContent = message;
  row.append(label); list.replaceChildren(row);
}
function showClipDuration(seconds) {
  const total = Math.floor(seconds);
  const minutes = Math.floor(total / 60);
  const time = [Math.floor(minutes / 60), minutes % 60, total % 60]
    .slice(minutes >= 60 ? 0 : 1).map(value => String(value).padStart(2, '0')).join(':');
  byId('clipDuration').textContent = `总时长 ${time}`;
}
eventPlayer.onloadedmetadata = () => {
  if (Number.isFinite(eventPlayer.duration)) showClipDuration(eventPlayer.duration);
};
async function playRecording(recording, endpoint) {
  const generation = ++playbackRequest;
  const duration = byId('clipDuration');
  byId('eventError').textContent = '';
  const type = recording.type === 'event' ? '事件录像' : '普通录像';
  byId('clipTitle').textContent = `第 ${recording.channel} 路 · ${type}`;
  const name = encodeURIComponent(recording.name);
  duration.textContent = '正在读取录像时长…';
  eventPlayer.src = `/api/${endpoint}/play/${name}?session=${session}`;
  byId('eventViewer').showModal();
  eventPlayer.play().catch(() => {});
  let seconds;
  try {
    ({seconds} = await (await request(`/api/${endpoint}/duration/${name}`)).json());
  } catch {}
  if (generation !== playbackRequest) return;
  if (Number.isFinite(eventPlayer.duration)) return;
  if (!Number.isFinite(seconds)) {
    duration.textContent = '暂时无法读取总时长';
    return;
  }
  showClipDuration(seconds);
}
function recordingRow(recording, endpoint) {
  const {name, type, channel, time, size} = recording;
  const title = `第 ${channel} 路 · ${type === 'event' ? '事件录像' : '连续录像'}`;
  const row = document.createElement('li'), label = document.createElement('span');
  const heading = document.createElement('strong'), detail = document.createElement('small');
  const play = document.createElement('button'), download = document.createElement('a');
  row.className = 'event-row'; label.className = 'recording-text';
  heading.textContent = title;
  const date = new Date(time).toLocaleString('zh-CN', {hour12:false});
  detail.textContent = `${type === 'event' ? '触发于' : '保存于'} ${date}` + (size ? ` · ${(size / 1e6).toFixed(2)} MB` : '');
  label.append(heading, detail);
  play.textContent = '回看'; download.textContent = '下载';
  download.href = `/api/${endpoint}/download/${name}?session=${session}`;
  play.onclick = () => playRecording(recording, endpoint);
  row.append(label, play, download);
  return row;
}
function shotURL(shot) { return `/api/shot/${shot.name}?session=${session}`; }
function openShot(shot) {
  const image = document.createElement('img');
  image.alt = '区域事件截图';
  image.src = shotURL(shot);
  byId('shotContent').replaceChildren(image);
  byId('viewer').showModal();
}
function eventCard(entry) {
  const card = document.createElement('li'), body = document.createElement('div');
  card.className = 'event-card'; body.className = 'event-body';
  const shots = entry.shots || [];
  const first = shots[0];
  if (first) {
    const preview = document.createElement('button'), image = document.createElement('img');
    preview.className = 'shot'; preview.type = 'button'; preview.onclick = () => openShot(first);
    image.loading = 'lazy'; image.alt = '查看事件截图'; image.src = shotURL(first);
    preview.append(image); card.append(preview);
  } else {
    const empty = document.createElement('small');
    empty.className = 'event-thumb-empty'; empty.textContent = '暂无截图'; card.append(empty);
  }
  const name = document.createElement('strong'), time = document.createElement('small');
  name.textContent = `第 ${entry.channel} 路 · 区域内检测到人员`;
  time.textContent = new Date(entry.time).toLocaleString('zh-CN', {hour12:false});
  body.append(name, time);
  if (shots.length) {
    const details = document.createElement('details'), summary = document.createElement('summary');
    summary.textContent = `${shots.length} 张事件截图`;
    const timeline = document.createElement('ul'); timeline.className = 'event-timeline';
    for (const shot of shots) {
      const item = document.createElement('li'), button = document.createElement('button');
      const stamp = document.createElement('time'), at = new Date(shot.time);
      button.type = 'button'; button.className = 'event-change';
      stamp.dateTime = at.toISOString(); stamp.textContent = at.toLocaleTimeString('zh-CN', {hour12:false});
      button.append(stamp, `区域人数 ${shot.previous} → ${shot.count} 人`);
      button.onclick = () => openShot(shot);
      item.append(button); timeline.append(item);
    }
    details.append(summary, timeline);
    body.append(details);
  }
  if (entry.name) {
    const actions = document.createElement('div'); actions.className = 'actions';
    const play = document.createElement('button'), download = document.createElement('a');
    play.type = 'button'; play.textContent = '回看';
    play.onclick = () => playRecording(entry, 'recordings');
    download.textContent = '下载'; download.href = `/api/recordings/download/${entry.name}?session=${session}`;
    actions.append(play, download); body.append(actions);
  }
  card.append(body);
  return card;
}
function showHistory() {
  const type = byId('historyType').value, day = byId('historyDate').value;
  const list = byId('historyList');
  const entries = historyEntries.filter(entry => {
    if (type && entry.type !== type) return false;
    if (!day) return true;
    const date = new Date(entry.time);
    const localDay = [date.getFullYear(), date.getMonth() + 1, date.getDate()].map(value => String(value).padStart(2, '0')).join('-');
    return localDay === day;
  });
  if (entries.length) list.replaceChildren(...entries.map(entry => entry.type === 'event' ? eventCard(entry) : recordingRow(entry, 'recordings')));
  else showListMessage(list, '暂无符合条件的录像');
}
async function loadHistory() {
  const refresh = byId('refreshHistory');
  refresh.disabled = true;
  try {
    historyEntries = await (await request('/api/recordings')).json();
    showHistory();
  } catch (error) {
    showListMessage(byId('historyList'), '无法读取录像列表，请刷新重试');
  } finally { refresh.disabled = false; }
}
function openHistory(type) {
  byId('historyType').value = type;
  byId('historyDate').value = '';
  showListMessage(byId('historyList'), '正在读取录像…');
  byId('historyViewer').showModal();
  loadHistory();
}
byId('openHistory').onclick = () => openHistory('');
byId('openEventHistory').onclick = () => openHistory('event');
byId('closeHistory').onclick = () => byId('historyViewer').close();
byId('refreshHistory').onclick = loadHistory;
byId('historyType').onchange = showHistory;
byId('historyDate').onchange = showHistory;
async function updateEvents() {
  try {
    const events = await (await request('/api/event-cards')).json();
    const signature = JSON.stringify(events);
    if (previousEvents === signature) return;
    previousEvents = signature;
    const list = byId('eventList');
    if (!events.length) {
      showListMessage(list, '暂无区域事件');
      return;
    }
    list.replaceChildren(...events.map(eventCard));
  } catch (_) {
    // A temporary connection failure will be retried with the next refresh.
  } finally { setTimeout(updateEvents, 2500); }
}
async function poll() {
  try {
    state = await (await request('/api/state')).json();
    if (!savingPolygon && areaMode && (state.channel !== polygonChannel || !state.active)) setAreaMode(null);
    showAlertState();
    showStorage();
    showDetectorModel();
    byId('status').textContent = state.message;
    byId('connectionLight').dataset.live = String(!!state.active && !!state.sequence);
    byId('videoTitle').textContent = state.active ? `第 ${state.channel} 路实时画面` : '实时画面';
    byId('count').textContent = state.count == null ? '—' : `${state.count} 人`;
    byId('recordIndicator').textContent = state.event_recording ? '事件录制中' : state.recording ? '连续录像中' : '待机';
    const devices = state.alerts?.devices?.length;
    byId('deviceIndicator').textContent = devices == null ? '—' : devices ? `已绑定 ${devices} 台` : '未绑定';
    byId('saved').textContent = state.saved ? '已记住。账号和密码留空即可使用。' : '尚未保存账号';
    byId('start').disabled = starting || state.active;
    byId('applyConnection').disabled = starting || state.active;
    byId('channel').disabled = state.active;
    byId('record').disabled = state.active;
    const ordinary = state.storage?.continuous;
    byId('recordStatus').textContent = state.recording && ordinary
      ? `普通录像 · 已用 ${(ordinary.used / 1e6).toFixed(1)} MB / ${ordinary.limit / 1e9} GB` : '';
    byId('eventStatus').textContent = state.event_recording ? '正在保存当前事件' : '';
    byId('stop').disabled = !state.active;
    byId('forget').disabled = !state.saved || state.active;
    byId('detect').disabled = !state.sequence || !state.regions[state.channel];
    byId('detect').textContent = state.detect ? '暂停检测' : '启动检测';
    if (!channelInitialized || state.active) {
      byId('channel').value = String(state.channel); channelInitialized = true;
    }
    if (state.sequence !== lastSequence) {
      const next = state.sequence ? await createImageBitmap(await (await request('/api/frame')).blob()) : null;
      bitmap?.close(); bitmap = next; lastSequence = state.sequence;
    }
    showAreaControls();
    draw();
  } catch(error) {
    byId('status').textContent = '本机服务暂不可用';
    byId('connectionLight').dataset.live = 'false';
    if (bitmap) {bitmap.close(); bitmap = null; lastSequence = 0; draw();}
    if (!savingPolygon && areaMode) setAreaMode(null);
    showAreaControls();
    if (error.status === 403) await reloadExpiredSession();
  } finally { setTimeout(poll, 220); }
}
draw(); poll(); updateEvents();
}
</script>
